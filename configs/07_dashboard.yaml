# @package _global_
# scripts/python/07_dashboard.py: the network map, two episode dashboards and a GIF of one dev episode
defaults:
  - main
  - _self_

episode: null # a dev episode; null: the first one in which a strait closes below min_open open
search: 60 # dev episodes 0 .. search - 1 to look through
min_open: 0.5 # the strait's observed open fraction must fall below this (a display choice)
naive: true # also play the naive rule on the same scenario (its demand model is computed once, then cached)
quick: false # true: a rough naive rule (seconds on a first run), not the board's
n_jobs: -1 # workers of the naive rule's first computation (-1: every core)
regime: standard # the scored information regime
# seed (main.yaml): env.reset(seed=seed); the episode itself is named by options={"episode": n}
